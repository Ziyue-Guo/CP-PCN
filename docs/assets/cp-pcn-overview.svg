<rect x="36" y="449" width="1088" height="58" rx="10" fill="#e6eff3" stroke="#9db6c4" stroke-dasharray="5 4"/>
<text x="57" y="475" font-size="15" fill="#274f65">Training supervision: multiscale completion losses + dynamic graph discriminator / adversarial loss</text>
<text x="57" y="495" font-size="12" fill="#527080">Reference missing points are training targets; model output does not include colors, normals or organ labels.</text>
<text x="36" y="537" font-size="12" fill="#527080">Conceptual overview. Paper configurations differ from source defaults; see the reproducibility notes.</text>
