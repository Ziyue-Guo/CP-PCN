<text x="414" y="317" font-size="18" font-weight="700">MRDG encoder</text><text x="414" y="350" font-size="15">Dynamic graph features</text><text x="414" y="390" font-size="18">2048 / 512 / 256</text>
<text x="705" y="317" font-size="18" font-weight="700">Point pyramid decoder</text><text x="705" y="350" font-size="15">Coarse to fine prediction</text><text x="705" y="390" font-size="18">128 / 256 / 2048</text>
