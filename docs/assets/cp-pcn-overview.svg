<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="558" viewBox="0 0 1160 558" role="img" aria-labelledby="title desc">
<title id="title">CP-PCN data workflow and completion network</title>
<desc id="desc">Multiview imagery and individual plant reconstruction support simulated canopy populations and visibility annotations. Visible XYZ points enter a multi-resolution dynamic graph encoder and point pyramid decoder to predict missing XYZ points. A graph discriminator and completion losses supervise training.</desc>
