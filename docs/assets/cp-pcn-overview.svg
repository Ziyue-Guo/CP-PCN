<text x="433" y="160" font-size="18" font-weight="700">Individual plants</text><text x="433" y="187" font-size="14">Meshes and point clouds</text>
<text x="713" y="160" font-size="18" font-weight="700">Population simulation</text><text x="713" y="187" font-size="14">Assembly and ray visibility</text>
