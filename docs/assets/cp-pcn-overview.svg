<text x="36" y="73" font-size="16" fill="#4c6978">From visible canopy surfaces to estimated occluded structure</text>
<text x="36" y="108" font-size="12" font-weight="700" letter-spacing="1.5" fill="#527080">RESEARCH DATA WORKFLOW</text>
